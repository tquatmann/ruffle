name: Build Test
# Builds and tests

on:
  push:
    branches:
      - master
  schedule:
    # run weekly
    - cron: '0 10 * * 4'
  # needed to trigger the workflow manually
  workflow_dispatch:
  pull_request:

env:
  # GitHub runners currently have 4 cores
  NR_JOBS: "4"
jobs:
  linux_tests:
    name: Linux tests (${{ matrix.config.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - {name: "CI, intree, Debug",
             base_image: "movesrwth/storm:ci-debug",
             build_type: "Debug",
             never_fetch_storm: "ON"
          }
          - {name: "CI, intree, Release",
             base_image: "movesrwth/storm:ci",
             build_type: "Release",
             never_fetch_storm: "ON"
          }
          - {name: "Stable, intree, Debug",
             base_image: "movesrwth/storm:stable-debug",
             build_type: "Debug",
             never_fetch_storm: "ON"
          }
          - {name: "Stable, intree, Release",
             base_image: "movesrwth/storm:stable",
             build_type: "Release",
             never_fetch_storm: "ON"
          }
    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - name: Build project from Dockerfile
        run: |
          docker build -t ruffle-ci . \
            --build-arg BASE_IMAGE=${{ matrix.config.base_image }} \
            --build-arg build_type="${{ matrix.config.build_type }}" \
            --build-arg never_fetch_storm="${{ matrix.config.never_fetch_storm }}" \
            --build-arg no_threads=${NR_JOBS}
      - name: Run Docker
        run: docker run -d -it --name ci ruffle-ci

      - name: Run and check output of example commands
        run: |
          docker exec ci bash -c "/opt/ruffle/build/bin/ruffle --input /opt/ruffle/examples/die.drn --output /tmp/die-widened.umb --mode widen-interval --delta 0.1 | grep 'Wrote resulting model to'"
          docker exec ci bash -c "/opt/ruffle/build/bin/ruffle --input /opt/ruffle/examples/die.drn --output /tmp/die-learned.drn --mode learn-interval --samples 1000 --seed 42 | grep 'Wrote resulting model to'"

  mac_tests:
    name: macOS Tests (${{ matrix.config.name }})
    strategy:
      matrix:
        config:
          - {name: "XCode Latest, ARM, fetch, intree, Debug",
             distro: "macos-15",
             xcode: "latest-stable",
             build_type: "Debug",
             never_fetch_storm: "OFF"
          }
          - {name: "XCode Latest, ARM, fetch, intree, Release",
             distro: "macos-15",
             xcode: "latest-stable",
             build_type: "Release",
             never_fetch_storm: "OFF"
          }
    runs-on: ${{ matrix.config.distro }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}
      - name: Git clone
        uses: actions/checkout@v7
      - name: Install dependencies
        # cmake and gmp are already installed
        run: |
          brew update
          brew install automake boost cln libarchive ginac glpk hwloc xerces-c z3
      - name: Configure ruffle
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE="${{ matrix.config.build_type }}" -DNEVER_FETCH_STORM="${{ matrix.config.never_fetch_storm }}" ..
      - name: Build ruffle
        working-directory: ./build
        run: make -j ${NR_JOBS}
      - name: Run and check output of example commands
        run: |
          /bin/bash -c "./build/bin/ruffle --input examples/die.drn --output /tmp/die-widened.umb --mode widen-interval --delta 0.1 | grep 'Wrote resulting model to'"
          /bin/bash -c "./build/bin/ruffle --input examples/die.drn --output /tmp/die-learned.drn --mode learn-interval --samples 1000 --seed 42 | grep 'Wrote resulting model to'"
